spring.application.name=server

# 로컬은 docker-compose.yml의 기본값과 맞춰뒀고, 배포 환경에서는 환경변수로 덮어쓰면 됨
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:recovery30}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 개발 편의용. 실제 배포 전에는 validate/none + 마이그레이션 도구(Flyway 등)로 바꿀 것
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
