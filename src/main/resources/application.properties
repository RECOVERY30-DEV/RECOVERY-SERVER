spring.application.name=server

# 로컬은 docker-compose.yml의 기본값과 맞춰뒀고, 배포 환경에서는 환경변수로 덮어쓰면 됨
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:recovery30}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 리버스 프록시(nginx) 뒤에 있으므로 X-Forwarded-* 를 신뢰해 scheme/host 를 복원한다
# (springdoc 서버 URL, 리다이렉트 Location 등이 https 로 나오도록)
server.forward-headers-strategy=framework

# 스키마는 Flyway(db/migration)가 관리한다. Hibernate는 엔티티<->스키마 불일치만 검증
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS 허용 도메인. 배포 환경에서는 CORS_ALLOWED_ORIGINS로 프론트 도메인을 지정할 것
# 기본값에 운영 도메인 포함 — Swagger UI("Try it out")가 같은 도메인에서 호출되므로 필요
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://recovery-30.shop}

# 배포 플랫폼 헬스체크용 (health만 노출, 상세 정보는 숨김)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
